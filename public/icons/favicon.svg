<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4503E"/>
      <stop offset="100%" stop-color="#8B2A1A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <!-- Top shine overlay -->
  <rect width="512" height="256" rx="88" fill="url(#shine)"/>

  <!-- Four ERP module blocks (2×2 grid) representing integrated modules -->
  <rect x="68"  y="68"  width="158" height="158" rx="22" fill="rgba(255,255,255,0.92)"/>
  <rect x="286" y="68"  width="158" height="158" rx="22" fill="rgba(255,255,255,0.70)"/>
  <rect x="68"  y="286" width="158" height="158" rx="22" fill="rgba(255,255,255,0.70)"/>
  <rect x="286" y="286" width="158" height="158" rx="22" fill="rgba(255,255,255,0.45)"/>

  <!-- Connector lines between blocks -->
  <rect x="234" y="130" width="44"  height="10" rx="5" fill="rgba(255,255,255,0.55)"/>
  <rect x="234" y="348" width="44"  height="10" rx="5" fill="rgba(255,255,255,0.40)"/>
  <rect x="130" y="234" width="10"  height="44" rx="5" fill="rgba(255,255,255,0.55)"/>
  <rect x="348" y="234" width="10"  height="44" rx="5" fill="rgba(255,255,255,0.40)"/>

  <!-- "Re" label in top-left block -->
  <text x="82" y="196" font-family="'Arial Black', 'Arial', sans-serif" font-size="118" font-weight="900" fill="#C74634">Re</text>

  <!-- "-" in top-right block -->
  <text x="316" y="175" font-family="'Arial Black', 'Arial', sans-serif" font-size="90" font-weight="900" fill="#C74634">-</text>

  <!-- "ERP" in bottom-left block -->
  <text x="76" y="406" font-family="'Arial', sans-serif" font-size="62" font-weight="700" fill="#C74634" letter-spacing="2">ERP</text>

  <!-- Decorative dot in bottom-right -->
  <circle cx="365" cy="365" r="28" fill="rgba(199,70,52,0.5)"/>
  <circle cx="365" cy="365" r="14" fill="rgba(199,70,52,0.7)"/>
</svg>
